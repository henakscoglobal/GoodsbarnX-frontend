  <style>
    /* Include all CSS here */
    :root {
      --ink: #12151C; --ink-2: #1B1F29; --paper: #EFE9DE; --paper-dim: #E2DBCC;
      --brass: #C88A34; --brass-bright: #E3A94F; --stamp: #A63D2F; --stamp-bright: #C24632;
      --ok: #3F7A4E; --line: rgba(239, 233, 222, 0.14); --line-dark: rgba(18, 21, 28, 0.12);
      --brass-dark: #9A6A22;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--ink); color: var(--paper); min-height: 100vh; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    ::selection { background: var(--brass); color: var(--ink); }
    h1, h2, h3, .display { font-family: 'Roboto Slab', Georgia, serif; font-weight: 700; letter-spacing: -0.01em; }
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; letter-spacing: 0.02em; }
    #app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; background: var(--ink); }
    .status-bar { height: env(safe-area-inset-top, 0px); background: var(--ink); }
    header.top { padding: 22px 20px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 40; background: linear-gradient(180deg, var(--ink) 80%, rgba(18, 21, 28, 0.96)); backdrop-filter: blur(6px); }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-name { font-family: 'Roboto Slab', serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
    .brand-sub { font-size: 10px; color: var(--brass-bright); text-transform: uppercase; letter-spacing: 0.14em; margin-top: 1px; }
    /* ... rest of CSS ... */
  </style>
</head>
<body>
  <div id="app">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Debug information

    function log(message, success = true) {
      const line = document.createElement('div');
      line.style.margin = '5px 0';
      line.style.color = success ? 'var(--ok)' : 'var(--stamp)';
      line.textContent = message;
      debugInfo.appendChild(line);
      console.log(message);
    }
    
    log('✓ HTML loaded successfully');
    log('✓ CSS styles applied');
    
    // Check if Supabase loaded
    if (typeof supabase !== 'undefined') {
      log('✓ Supabase library loaded');
      
      try {
        const sb = supabase.createClient(
          "https://zcxecnxirfdfvywnvcjp.supabase.co",
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjeGVjbnhpcmZkZnZ5d252Y2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMDIyMTMsImV4cCI6MjEwMDY3ODIxM30.ooKObFp6Mj_gKlVLZXnVyeDAdfdjzDJwqx2buimmBtI"
        );
        log('✓ Supabase client created');
        
        // Test database connection
        sb.from("profiles").select("*", { count: "exact", head: true })
          .then(({ count, error }) => {
            if (error) {
              log('✗ Database connection failed: ' + error.message, false);
            } else {
              log('✓ Database connected successfully');
              log('✓ Found ' + count + ' profiles in database');
              
              // Now load the full app
              loadFullApp();

          })
          .catch(error => {
            log('✗ Database error: ' + error.message, false);
          });
        
      } catch (error) {
        log('✗ Supabase initialization failed: ' + error.message, false);
      }
    } else {
      log('✗ Supabase library failed to load', false);
    }
    
    function loadFullApp() {
      log('✓ Loading full application...');

      setTimeout(() => {
